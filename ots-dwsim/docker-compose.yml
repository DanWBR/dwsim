version: '3.8'

services:
  # TimescaleDB for time-series data storage
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: ots-timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_DB: ots_timeseries
      POSTGRES_USER: ots_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ots_password}
      TIMESCALEDB_TELEMETRY: 'off'
    ports:
      - "5433:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
      - ./src/infra/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ots_user -d ots_timeseries"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ots-network

  # DWSIM Simulation Host (Backend API)
  dwsim-host:
    build:
      context: ./src/dwsim-host
      dockerfile: Dockerfile
    container_name: ots-dwsim-host
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:5000
      ConnectionStrings__TimescaleDB: "Host=timescaledb;Port=5432;Database=ots_timeseries;Username=ots_user;Password=${POSTGRES_PASSWORD:-ots_password}"
      FlowsheetPath: /app/data/flowsheets
      SnapshotPath: /app/data/snapshots
      ScenarioPath: /app/data/scenarios
      RuleSetPath: /app/data/rulesets
      ScenarioSchemaPath: /app/schemas/scenario.schema.json
      TimeSeriesLogging__Enabled: "true"
      TimeSeriesLogging__PollingIntervalMs: "1000"
      TimeSeriesLogging__BatchSize: "100"
    ports:
      - "5000:5000"
    volumes:
      - flowsheet_data:/app/data/flowsheets
      - snapshot_data:/app/data/snapshots
      - scenario_data:/app/data/scenarios
      - ruleset_data:/app/data/rulesets
      - ./samples/scenarios:/app/samples/scenarios:ro
      - ./samples/rulesets:/app/samples/rulesets:ro
    depends_on:
      timescaledb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - ots-network

  # Operator HMI (React Frontend)
  operator-hmi:
    build:
      context: ./src/hmi-operator
      dockerfile: Dockerfile
    container_name: ots-operator-hmi
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - dwsim-host
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - ots-network

  # Instructor Console (React Frontend)
  instructor-ui:
    build:
      context: ./src/hmi-instructor
      dockerfile: Dockerfile
    container_name: ots-instructor-ui
    restart: unless-stopped
    ports:
      - "3001:80"
    depends_on:
      - dwsim-host
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - ots-network

volumes:
  timescaledb_data:
    driver: local
  flowsheet_data:
    driver: local
  snapshot_data:
    driver: local
  scenario_data:
    driver: local
  ruleset_data:
    driver: local

networks:
  ots-network:
    driver: bridge
